name: tmp-secret-xfer
# Temporary: seal 5 shared signing secrets for another repo (sealed-box to its public key). Removed right after use.
on:
  workflow_dispatch:
    inputs:
      target_key:
        description: target repo Actions public key (base64)
        required: true
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Seal
        env:
          TARGET_KEY: ${{ inputs.target_key }}
          S_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          S_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          S_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          pip install -q pynacl
          python3 - <<'PY'
          import base64, json, os
          from nacl import encoding, public
          pk = public.PublicKey(os.environ["TARGET_KEY"].encode(), encoding.Base64Encoder())
          box = public.SealedBox(pk)
          out = {}
          for n in ["APP_STORE_CONNECT_KEY_ID","APP_STORE_CONNECT_ISSUER_ID","APP_STORE_CONNECT_API_KEY_P8","IOS_DISTRIBUTION_P12_BASE64","IOS_DISTRIBUTION_P12_PASSWORD"]:
              v = os.environ.get("S_" + n, "")
              assert v, f"{n} empty"
              out[n] = base64.b64encode(box.encrypt(v.encode())).decode()
          json.dump(out, open("sealed.json", "w"))
          print("sealed", len(out), "secrets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed
          path: sealed.json
          retention-days: 1
