name: TEMP secret transfer (sealed for target repo)
# Temporary: encrypts the ASC/signing secrets with the TARGET repo's public
# Actions key (libsodium sealed box). Only GitHub can decrypt the output.
# Plaintext is never printed. Removed right after use.
on:
  workflow_dispatch:
    inputs:
      target_key:
        description: target repo Actions public key (base64)
        required: true
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Seal secrets
        env:
          TARGET_KEY: ${{ inputs.target_key }}
          S_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          S_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          S_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          pip install -q pynacl
          python3 - <<'PY'
          import os, json, base64
          from nacl import public, encoding
          pk = public.PublicKey(os.environ["TARGET_KEY"].encode(), encoding.Base64Encoder())
          box = public.SealedBox(pk)
          out = {}
          for k, v in os.environ.items():
              if k.startswith("S_"):
                  assert v, f"{k[2:]} empty"
                  out[k[2:]] = base64.b64encode(box.encrypt(v.encode())).decode()
          json.dump(out, open("sealed.json", "w"))
          print("sealed:", sorted(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed
          path: sealed.json
          retention-days: 1
