name: iOS simulator screenshots

# Builds the app for the simulator and captures real screenshots at the App Store sizes (iPhone
# 6.9" 1320x2868, iPad 13" 2064x2752): launch, then Result (demo scan), Player (Ode to Joy sample,
# playing), Library and Settings via Debug-only launch args. Artifacts only; copy into docs/asc/screenshots/.
# Job `paywall`: the real PaywallView with OMRSheetCam.storekit prices (Tests/PaywallScreenshotTests.swift,
# SKTestSession) on iPhone 6.9"; copy into docs/asc/review/subscription-paywall.png.

on:
  workflow_dispatch:
    inputs:
      only_paywall:
        description: Only capture the Music Reader Pro paywall (subscription review screenshot)
        type: boolean
        default: false

jobs:
  shots:
    if: ${{ !inputs.only_paywall }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode_16.4.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version

      - name: Fetch ONNX models (bundled by the build; sha256-pinned)
        run: scripts/fetch-models

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OMRSheetCam.xcodeproj -scheme OMRSheetCam -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" -A3 "$RUNNER_TEMP/build.log" | head -120; tail -40 "$RUNNER_TEMP/build.log"; exit 1; }
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'OMRSheetCam.app' -maxdepth 3 | head -1)
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Capture screenshots
        run: |
          set -euo pipefail
          mkdir -p shots
          xcrun simctl list devicetypes | grep -E 'iPhone 1[6-9] Pro Max|iPad Pro 13' || true
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:[int(n) for n in x["version"].split(".")])[-1]["identifier"])')
          shoot() {
            local label="$1" pattern="$2"
            local dt
            dt=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; d=[x for x in json.load(sys.stdin)['devicetypes'] if re.search(r'''$pattern''', x['name'])]; print(sorted(d,key=lambda x:x['name'])[-1]['identifier'])")
            local id
            id=$(xcrun simctl create "shot-$label" "$dt" "$RT")
            xcrun simctl boot "$id"
            xcrun simctl bootstatus "$id" -b
            xcrun simctl status_bar "$id" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$id" "$APP"
            xcrun simctl launch "$id" com.ragnus.vp
            sleep 8
            xcrun simctl io "$id" screenshot "shots/${label}-01-launch.png"
            sips -g pixelWidth -g pixelHeight "shots/${label}-01-launch.png"
            # Debug-only deep links (Sources/App/ScreenshotDemo.swift): -OMRScreenshot <route>
            local n=2
            for route in result player library settings; do
              xcrun simctl terminate "$id" com.ragnus.vp || true
              xcrun simctl launch "$id" com.ragnus.vp -OMRScreenshot "$route"
              sleep 10
              xcrun simctl io "$id" screenshot "shots/${label}-0${n}-${route}.png"
              n=$((n + 1))
            done
            xcrun simctl shutdown "$id" || true
          }
          shoot iphone-69 'iPhone 1[6-9] Pro Max'
          shoot ipad-13 'iPad Pro 13'
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/

  paywall:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('models.lock') }}

      - name: Fetch models (idempotent, SHA-256 verified)
        run: scripts/fetch-models

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Boot iPhone 6.9" simulator (light, clean status bar)
        run: |
          set -euo pipefail
          xcodebuild -version
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:[int(n) for n in x["version"].split(".")])[-1]["identifier"])')
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; d=[x for x in json.load(sys.stdin)['devicetypes'] if re.search(r'iPhone 1[6-9] Pro Max', x['name'])]; print(sorted(d,key=lambda x:x['name'])[-1]['identifier'])")
          echo "runtime=$RT devicetype=$DT"
          SIM=$(xcrun simctl create paywall-shot "$DT" "$RT")
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl ui "$SIM" appearance light || true
          xcrun simctl status_bar "$SIM" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Run PaywallScreenshotTests and capture the simulator screen
        env:
          TEST_RUNNER_OMR_PAYWALL_SHOT: "1"
          TEST_RUNNER_OMR_PAYWALL_OUT: ${{ runner.temp }}/paywall
          TEST_RUNNER_OMR_MODELS_DIR: ${{ github.workspace }}/models
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/paywall"; mkdir -p "$OUT" shots
          xcodebuild test \
            -project OMRSheetCam.xcodeproj -scheme OMRSheetCam \
            -destination "id=$SIM" \
            -only-testing:OMRSheetCamTests/PaywallScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/paywall.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/paywall-xcodebuild.log" 2>&1 &
          XB=$!
          for i in $(seq 1 3000); do
            [[ -f "$OUT/paywall-ready" ]] && break
            kill -0 $XB 2>/dev/null || break
            sleep 1
          done
          if [[ -f "$OUT/paywall-ready" ]]; then
            sleep 2
            xcrun simctl io "$SIM" screenshot shots/subscription-paywall.png
            touch "$OUT/paywall-done"
          fi
          wait $XB; rc=$?
          grep -E "paywall-shot|error:|XCTAssert|Test Case|failed|passed|skipped" "$RUNNER_TEMP/paywall-xcodebuild.log" | tail -60
          [[ $rc -eq 0 ]] || { tail -80 "$RUNNER_TEMP/paywall-xcodebuild.log"; exit $rc; }
          test -f shots/subscription-paywall.png
          cp "$OUT/paywall-render.png" shots/ || true
          sips -g pixelWidth -g pixelHeight shots/*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paywall-screenshot
          path: |
            shots/
            ${{ runner.temp }}/paywall-xcodebuild.log
          if-no-files-found: ignore
