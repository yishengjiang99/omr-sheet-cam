# iOS simulator build + app tests (incl. Gate-1 CoreML: Tests/Gate1StaffTokenMatchTests.swift).
name: iOS Simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  # main gets frequent pushes: let an in-progress main run finish (newer pushes queue behind it).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: OMRSheetCamTests (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('models.lock') }}

      - name: Fetch models (idempotent, SHA-256 verified)
        run: scripts/fetch-models && ls -l models

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode info
        run: |
          xcodebuild -version
          xcodebuild -list -project OMRSheetCam.xcodeproj

      - name: Resolve simulator (newest iOS runtime, first iPhone)
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          ios = [r for r in d if ".SimRuntime.iOS-" in r and any("iPhone" in x["name"] for x in d[r])]
          if not ios: sys.exit("no iOS runtime with an iPhone simulator")
          rt = max(ios, key=lambda r: [int(n) for n in re.findall(r"\d+", r.split("iOS-")[1])])
          prefer = ["iPhone 17", "iPhone 16", "iPhone 16 Pro", "iPhone 15"]
          names = [x["name"] for x in d[rt] if "iPhone" in x["name"]]
          print(next((p for p in prefer if p in names), names[0]))
          ')
          echo "Using simulator: $name"
          echo "destination=platform=iOS Simulator,name=$name,OS=latest" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test
        env:
          # xcodebuild strips TEST_RUNNER_ and forwards to the simulator test process.
          TEST_RUNNER_OMR_MODELS_DIR: ${{ github.workspace }}/models
        run: |
          set -o pipefail
          xcodebuild test \
            -project OMRSheetCam.xcodeproj \
            -scheme OMRSheetCam \
            -destination "${{ steps.sim.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/OMRSheetCam.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: SF2Player package tests (macOS, gbk parity)
        if: always()
        env:
          SF2PLAYER_SF2: ${{ github.workspace }}/models/GeneralUser-GS.sf2
        run: |
          set -o pipefail
          swift test --package-path Packages/SF2Player 2>&1 | tee "$RUNNER_TEMP/sf2player.log"

      - name: Gate-1 + warmup summary
        if: always()
        run: |
          grep -E "Gate1StaffTokenMatchTests|Gate-1|ModelWarmupTests|Warmup:|\[warmup\]|\[sf2\]|SF2PlayerAppTests|Bundled ONNX|models not bundled" "$RUNNER_TEMP/xcodebuild.log" || echo "no Gate-1 / warmup lines"
          if grep -F "should not be called on the main thread" "$RUNNER_TEMP/xcodebuild.log"; then
            echo "::warning::CoreML main-thread warning present"
          else
            echo "no CoreML main-thread warning"
          fi

      - name: App bundle size
        if: always()
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Debug-iphonesimulator/OMRSheetCam.app' -maxdepth 6 | head -1)
          if [ -n "$APP" ]; then du -sh "$APP" "$APP/models" "$APP/OMRSheetCam" 2>/dev/null; ls -l "$APP/models" 2>/dev/null; fi

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OMRSheetCam-xcresult
          path: |
            ${{ runner.temp }}/OMRSheetCam.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
