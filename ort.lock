# ort.lock — pinned official ONNX Runtime Linux CPU release, consumed by scripts/fetch-ort.
# Same format as models.lock:  <sha256>  <filename>  <url>   (blank lines and # comments skipped)
# <sha256> is the SHA-256 of the release tarball itself (matches GitHub's release asset digest).
#
# 1.30.0 = latest stable; the same version is published as the onnxruntime-objc CocoaPod (1.30.0),
# so iOS (objc + CoreML) and Linux (C API, CPU EP only) can run identical ORT kernels. It is also
# what `pip install onnxruntime` gives the Python homr oracle today: the fp16 encoder context from
# ORTCSession on 1.30.0 is bit-identical to Python homr's (1.24.2 differed by up to 0.0039).
# Bump all lines together.
