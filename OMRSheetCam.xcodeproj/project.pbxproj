			shellScript = "# Copies the Gate-1 oracle fixtures (fixtures/oracle.c_scale_staff: staff.npy, staff.png,\n# expected.tokens.json; tracked in git, never edited here) into <App>.app/gate1/ for the in-app\n# \"Run Gate-1\" section. Fails if any is missing.\nset -eu\nSRC=\"${SRCROOT}/fixtures/oracle.c_scale_staff\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/gate1\"\nmkdir -p \"$DST\"\nfor n in staff.npy staff.png expected.tokens.json; do\n  [ -f \"$SRC/$n\" ] || { echo \"error: Gate-1 fixture missing: $SRC/$n\" >&2; exit 1; }\n  cp -p \"$SRC/$n\" \"$DST/$n\"\ndone\necho \"Bundled Gate-1 fixtures: $(echo $(ls \"$DST\"))\"\n";
