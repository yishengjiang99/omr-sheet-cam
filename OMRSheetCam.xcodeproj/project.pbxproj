			shellScript = "# Copies the pinned homr ONNX models (models.lock: SegNet fp16, Encoder fp16, Decoder fp32; fetched by\n# scripts/fetch-models into gitignored models/) into <App>.app/models/. Never committed to git.\n# Missing models FAIL the build, except test-only builds where OMR_MODELS_DIR or\n# TEST_RUNNER_OMR_MODELS_DIR supplies them at run time (warning, nothing bundled).\n# OMR_REQUIRE_MODELS=1 (TestFlight archive) always fails on missing models.\nset -eu\nSRC=\"${SRCROOT}/models\"\nLOCK=\"${SRCROOT}/models.lock\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/models\"\nnames=$(grep -Ev '^[[:space:]]*(#|$)' \"$LOCK\" | awk '{print $2}')\n[ -n \"$names\" ] || { echo \"error: no models listed in $LOCK\" >&2; exit 1; }\nmissing=\"\"\nfor n in $names; do [ -f \"$SRC/$n\" ] || missing=\"$missing $n\"; done\nif [ -n \"$missing\" ]; then\n  RUNTIME_DIR=\"${OMR_MODELS_DIR:-${TEST_RUNNER_OMR_MODELS_DIR:-}}\"\n  if [ \"${OMR_REQUIRE_MODELS:-0}\" != \"1\" ] && [ -n \"$RUNTIME_DIR\" ]; then\n    echo \"warning: models not bundled (missing:$missing); test-only build, models from $RUNTIME_DIR at run time\"\n    exit 0\n  fi\n  echo \"error: ONNX models missing in $SRC:$missing. Run scripts/fetch-models (pinned in models.lock). Test-only builds may set OMR_MODELS_DIR instead.\" >&2\n  exit 1\nfi\nmkdir -p \"$DST\"\nfor n in $names; do\n  if [ ! -f \"$DST/$n\" ] || [ \"$SRC/$n\" -nt \"$DST/$n\" ] || ! cmp -s \"$SRC/$n\" \"$DST/$n\"; then cp -p \"$SRC/$n\" \"$DST/$n\"; fi\ndone\nfor f in \"$DST\"/*; do\n  b=$(basename \"$f\")\n  case \" $(echo $names) \" in *\" $b \"*) ;; *) rm -rf \"$f\" ;; esac\ndone\necho \"Bundled ONNX models ($(du -sh \"$DST\" | cut -f1)): $(echo $names)\"\n";
